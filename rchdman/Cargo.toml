[package]
name = "rchdman"
version = "0.4.0"
authors = ["Ronny Chan <ronny@ronnychan.ca>"]
edition = "2021"
description = "CHDMAN Utility implementations in Rust"
license = "BSD-3-Clause"
repository = "https://github.com/SnowflakePowered/chd-rs"
readme = "../README.md"
categories = ["emulators", "compression", "encoding"]
keywords = ["mame", "chd", "decompression"]
[lib]
name = "rchdman"
path = "src/lib.rs"

[[bin]]
name = "rchdman"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The rchdman command line.
cli = ["dep:clap", "dep:thousands", "dep:hex", "dep:num-traits"]

[dependencies]
chd = { version = "0.4", path = "../chd-rs", features = ["unstable_lending_iterators", "max_perf", "encode"]}
sha1 = "0.10.1"
arrayvec = "0.7"
rcue = "0.1.3"
lender = { version = "0.8", default-features = false }

# Dependencies of the command line.
clap = { version = "3", features = ["derive"], optional = true }
thousands = { version = "0.2.0", optional = true }
hex = { version = "0.4", optional = true }
num-traits = { version = "0.2", optional = true }
