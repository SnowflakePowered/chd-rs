[package]
name = "chd"
version = "0.3.5"
authors = ["Ronny Chan <ronny@ronnychan.ca>"]
edition = "2021"
description = "Rust implementation of the CHD File Format"
license = "BSD-3-Clause"
repository = "https://github.com/SnowflakePowered/chd-rs"
readme = "../README.md"
categories = ["emulators", "compression", "encoding"]
keywords = ["mame", "chd", "decompression"]

[features]
default = ["std", "cd_full", "fast_lzma", "fast_zstd"]
cd_full = ["want_subcode", "want_raw_data_sector"]
std = []

# disabled by default for speed
verify_block_crc = ["want_subcode", "want_raw_data_sector"]

# currently unstable APIs
huffman_api = []
codec_api = []
unstable_lending_iterators = [ "lending-iterator", "nougat" ]

# if disabled results may be unwanted
want_subcode = []
want_raw_data_sector = []

# performance tweaks
max_perf = ["fast_lzma", "fast_zstd"]
fast_lzma = ["std"] # this does nothing now, since lzma-rust2 is used for LZMA.
fast_zstd = ["std", "dep:zstd-safe"]
fast_zlib = ["std"] # this does nothing now, since zlib-rs is already enabled.

# Revert to zlib-ng, since zlib-rs is faster now.
c_zlib = ["std", "flate2/zlib-ng"]

# compression support for codecs
encode = ["std", "huff_write", "lzma-rust2/encoder", "dep:flacenc", "dep:sha1", "dep:parking_lot"]
huff_write = ["dep:bitstream-io"]
nonstandard_channel_count = []

[dependencies]
byteorder = "1"
num-traits = "0.2"
num-derive = "0.4"
crc = "3"
arrayvec = "0.7"
text_io = "0.1"

# codecs
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] } # zlib-rs is faster than zlib-ng.

lzma-rust2 = { version = "0.22", default-features = false, features = ["std", "optimization"] }
claxon = "0.4"
bitreader = "0.3.6"
bitstream-io = { version = "4.10", optional = true }
ruzstd = "0.9.1"

zstd-safe = { version = "7.2.0", optional = true }
# lending-iterator
lending-iterator = { version = "0.1", optional = true }
nougat = { version = "0.2", optional = true }
flacenc = { version = "0.5", default-features = false, optional = true }
zerocopy = { version = "0.8", features = ["derive"] }
sha1 = { version = "0.10", optional = true }
parking_lot = { version = "0.12", optional = true }

[dev-dependencies]
bencher = "0.1.5"
rand = "0.10"

[[bench]]
name = "bench"
harness = false

[package.metadata.docs.rs]
features = ["default", "codec_api", "huffman_api", "encode", "unstable_lending_iterators"]
rustdoc-args = ["--cfg", "docsrs"]
